# Deploys a release of a Vercel app: Vercel builds main itself, so this waits for the Production deployment of the
# tagged commit, then runs a health check, and reports the result to the hub (Telegram). Started by a release or hotfix
# tag, or by hand / by the hub after an approval: `gh workflow run deploy.yml -f tag=vX.Y.Z [-f approved=true]`.
# Generated by `pl deploy-init`.
name: Deploy
run-name: Deploy ${{ github.event.inputs.tag || github.ref_name }}

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to deploy (vX.Y.Z)"
        required: true
      approved:
        description: "Ian has run the release's backfill"
        type: boolean
        default: false

permissions:
  contents: read
  deployments: read

concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false

env:
  PROJECT: Ian Portfolio
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Start time
        run: echo "STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      # The report script comes from this workflow's own commit, not the tag: an older tag (a rollback)
      # may not have it, and a failed checkout above must still be reported.
      - name: Report script
        if: always()
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci
          sparse-checkout: scripts

      - name: Gate (tag on main, backfill)
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED: ${{ github.event.inputs.approved || 'false' }}
        run: |
          set -u
          echo "DEPLOY_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "GATE=skipped" >> "$GITHUB_ENV"; echo "GATE_REASON=$TAG isn't a release tag" >> "$GITHUB_ENV"; exit 0
          fi
          git fetch -q origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "GATE=skipped" >> "$GITHUB_ENV"; echo "GATE_REASON=$TAG's commit isn't on main" >> "$GITHUB_ENV"; exit 0
          fi
          # The release skill pushes the tag, then creates the GitHub release: wait for its notes.
          for i in $(seq 1 18); do
            gh release view "$TAG" --json body --jq .body > notes.md 2>/dev/null && break
            rm -f notes.md; sleep 10
          done
          if [ ! -f notes.md ]; then
            echo "GATE=skipped" >> "$GITHUB_ENV"; echo "GATE_REASON=no GitHub release for $TAG after 3 minutes, so its backfill line can't be checked" >> "$GITHUB_ENV"; exit 0
          fi
          if ! BACKFILL="$(node .ci/scripts/deploy-report.mjs --backfill notes.md)"; then
            echo "GATE=skipped" >> "$GITHUB_ENV"; echo "GATE_REASON=couldn't check $TAG's notes for a backfill line" >> "$GITHUB_ENV"; exit 0
          fi
          if [ "$BACKFILL" = "yes" ] && [ "$APPROVED" != "true" ]; then
            echo "GATE=waiting" >> "$GITHUB_ENV"
            echo "GATE_REASON=$(grep -m1 '^Backfill:' notes.md | cut -c1-280)" >> "$GITHUB_ENV"; exit 0
          fi
          echo "GATE=deploy" >> "$GITHUB_ENV"

      - name: Wait for the Vercel deployment
        id: vercel
        if: env.GATE == 'deploy'
        continue-on-error: true
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          for i in $(seq 1 60); do
            id=$(gh api "repos/$GITHUB_REPOSITORY/deployments?sha=$DEPLOY_SHA&per_page=30" --jq '[.[] | select(.environment | startswith("Production"))][0].id // empty')
            if [ -n "$id" ]; then
              state=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" --jq '.[0].state // empty')
              echo "Vercel deployment $id: ${state:-no status yet}"
              case "$state" in
                success|inactive) exit 0 ;;
                failure|error) echo "Vercel reported the deployment as $state"; exit 1 ;;
              esac
            else
              echo "No Production deployment for $DEPLOY_SHA yet"
            fi
            sleep 15
          done
          echo "Gave up after 15 minutes waiting for Vercel"; exit 1

      - name: Health check
        id: health
        if: env.GATE == 'deploy' && steps.vercel.outcome == 'success' && vars.HEALTH_URL != ''
        continue-on-error: true
        run: curl -fsS --retry 5 --retry-delay 10 --retry-all-errors -o /dev/null "${{ vars.HEALTH_URL }}"

      - name: Report
        if: always()
        env:
          OUTCOME_VERCEL: ${{ steps.vercel.outcome }}
          OUTCOME_HEALTH: ${{ steps.health.outcome }}
          HUB_URL: https://africa-south1-codesynergi-hub.cloudfunctions.net/deployResult
          DEPLOY_RESULT_SECRET: ${{ secrets.DEPLOY_RESULT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node .ci/scripts/deploy-report.mjs
